<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👤 User View</title>
<style>
  body { margin:0; padding:0; font-family: system-ui, sans-serif; overflow: hidden; background: #0f172a; }
  #loading { padding:40px; text-align:center; color:#fff; font-size: 18px; }
  #contentFrame { width: 100vw; height: 100dvh; border: none; display: none; }
</style>
</head>
<body>
  <div id="loading">⏳ Loading Terminal...</div>
  <iframe id="contentFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin allow-presentation"></iframe>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqGMErCVVSm9xWilusYzlsYQStSiAQdV0",
      authDomain: "livehtmlcontroller.firebaseapp.com",
      databaseURL: "https://livehtmlcontroller-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "livehtmlcontroller",
      storageBucket: "livehtmlcontroller.firebasestorage.app",
      messagingSenderId: "452088343201",
      appId: "1:452088343201:web:f58a911ff26763be905ee0",
      measurementId: "G-LG0M4CMZJN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const iframe = document.getElementById("contentFrame");
    const loadingEl = document.getElementById("loading");
    let currentBlobUrl = null;

    onValue(ref(db, "page/html"), (snapshot) => {
      const html = snapshot.val() || "";
      
      if (html.trim() !== "") {
        loadingEl.style.display = "none";
        iframe.style.display = "block";
        
        // Purana Blob URL delete karein memory se
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }

        // Naya Blob URL banayein
        const blob = new Blob([html], { type: 'text/html' });
        currentBlobUrl = URL.createObjectURL(blob);
        
        // Iframe mein load karein
        iframe.src = currentBlobUrl;
      } else {
        loadingEl.style.display = "block";
        iframe.style.display = "none";
      }
    });
  </script>
</body>
</html>
